<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>アクセス制限</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
    }
    .box {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { color: #e53e3e; }
    p { color: #555; }
  </style>
</head>
<body>
  <div class="box">
    <h1>アクセスできません</h1>
    <p>このサイトは<strong>日本国内</strong>からのみご利用いただけます。</p>
    <p>This site is only available within Japan.</p>
  </div>
</body>
</html>
