name: Deploy Blog to S3

on:
  push:
    branches:
      - main # mainブランチにプッシュされたら起動

concurrency:
  group: 'deploy-blog'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDCを使用する場合に必要
      contents: read # コードを取得するために必要

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # テーマ（submodule）も一緒に取得する
          fetch-depth: 1
          persist-credentials: false # AWSの認証情報を使うので、GitHubの認証情報は不要

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ vars.HUGO_VERSION }} # 使用するHugoのバージョン
          extended: true # hugo-paperテーマ等で必要なextended版

      - name: Build site
        run: |
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/MyBlogGitHubActionsRole
          aws-region: ${{ vars.AWS_REGION }}

          # Cloud Trail監査
          role-session-name: github-actions-${{ github.run_id }}

          # セキュリティ
          mask-aws-account-id: true
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          unset-current-credentials: true
          retry-max-attempts: 3
          # 有効期限
          role-duration-seconds: 900 # 15分

      - name: Deploy to S3
        run: |
          aws s3 sync ./public s3://${{ secrets.AWS_S3_BUCKET }} \
            --delete \
            --exact-timestamps \
            --only-show-errors

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
