baseURL = "https://blog.lieny.net/"
title = 'My BLOG'
theme = 'paper'

# 言語・ロケールの最適化
defaultContentLanguage = 'ja'
languageCode = 'ja-JP'

[languages]
  [languages.ja]
    languageName = '日本語'
    weight = 1

[frontmatter]
  date = ['date', 'publishDate', 'lastmod']

[params]
  github = 'taigamiura'
  mainSections = ['posts']

  # paperテーマで日付フォーマットを変更したい場合（テーマの仕様に依存します）
  dateFormat = "2006-01-02" 

[permalinks]
  posts = '/posts/:year/:month/:slug/'
